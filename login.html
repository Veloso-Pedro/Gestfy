<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Gestfy</title>
    
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body class="pagina-login">

    <div class="container-login">
        
        <div class="cartao-login">
            <div class="logo-login">
                <img src="./img/logo.jpeg" alt="Gestfy" height="40">
            </div>

            <h2>Bem-vindo de volta!</h2>
            <p>Acesse seu painel financeiro.</p>

            <form id="form-login" class="formulario">
                
                <div class="grupo-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="grupo-input">
                    <label for="senha">Palavra-passe</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <div class="opcoes-login">
                    <a href="#" class="link-esqueci">Esqueci a senha</a>
                </div>

                <button type="submit" id="btn-login" class="botao-enviar">Entrar</button>
            </form>
            
            <div class="voltar-site">
                <a href="./index.html">&larr; Voltar ao site principal</a>
            </div>
        </div>

    </div>

    <script type="module" src="./js/supabase-config.js"></script>
    <script type="module" src="./js/login.js"></script>

</body>
</html>
