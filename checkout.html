<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Gestfy</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/checkout.css">
</head>

<body class="pagina-checkout">

    <div class="container-checkout">

        <header class="header-checkout">
            <a href="./index.html" class="link-voltar-topo">
                <img src="./img/logo.jpeg" alt="Gestfy" height="32">
                Voltar
            </a>

            <span class="ambiente-seguro">🔒 Ambiente Seguro e Criptografado</span>
        </header>

        <div class="grid-checkout">

            <div class="coluna-dados">
                <div class="cartao-branco">
                    <h2>Dados da Empresa</h2>
                    <p>Preenche os dados para criar a sua conta de acesso.</p>

                    <form id="form-registro" class="formulario">

                        <div class="linha-inputs">
                            <div class="grupo-input">
                                <label for="nome">Nome Completo</label>
                                <input type="text" id="nome" name="nome" required>
                            </div>
                            <div class="grupo-input">
                                <label for="cnpj">CNPJ / CPF</label>
                                <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required>
                            </div>
                        </div>

                        <div class="grupo-input">
                            <label for="email">E-mail de Acesso</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="grupo-input">
                            <label for="senha">Criar Palavra-passe</label>
                            <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required>
                        </div>

                        <label for="regime-tributario">Qual o regime da empresa?</label>
                        <select id="regime-tributario" required>
                            <option value="mei">MEI</option>
                            <option value="me">ME (Simples Nacional)</option>
                            <option value="lucro_presumido">Lucro Presumido</option>
                        </select>

                        <hr class="divisor">

                        <h2>Pagamento</h2>
                        <div class="grupo-input">
                            <label for="cartao">Número do Cartão</label>
                            <input type="text" id="cartao" name="cartao" placeholder="0000 0000 0000 0000">
                        </div>

                        <div class="linha-inputs">
                            <div class="grupo-input">
                                <label for="validade">Validade</label>
                                <input type="text" id="validade" name="validade" placeholder="MM/AA">
                            </div>
                            <div class="grupo-input">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" name="cvv" placeholder="123">
                            </div>
                        </div>

                        <button type="submit" id="btn-registrar" class="botao-enviar-checkout">Confirmar
                            Assinatura</button>
                    </form>
                </div>
            </div>

            <div class="coluna-resumo">
                <div class="cartao-resumo">
                    <h2>Resumo do Pedido</h2>

                    <h3 id="resumo-nome-plano">Plano Anual - Gestfy</h3>

                    <h3 id="resumo-preco-plano">R$ 468,00</h3>

                    <hr>

                    <ul class="lista-vantagens">
                        <li>✔️ Acesso total ao sistema</li>
                        <li>✔️ Suporte prioritário</li>
                    </ul>

                    <hr>

                    <div class="total-cobrado">
                        <p>Total a pagar hoje:</p>
                        <h1 id="resumo-preco-total">R$ 468,00</h1>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="./js/supabase-config.js"></script>
    <script type="module" src="./js/checkout.js"></script>

</body>

</html>
